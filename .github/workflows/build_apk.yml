name: Tự động đóng gói App Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài đặt Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Khởi tạo Android Scaffolding và Dependencies
        run: |
          if [ -d "mobile_app" ] && [ -f "mobile_app/pubspec.yaml" ]; then
            cd mobile_app
          fi
          # Tự động tạo đầy đủ Gradle và Android scaffolding chuẩn
          flutter create --org com.thegioidienthoai --project-name smart_erp_mobile --platforms=android .
          # Cấp quyền Camera & Internet vào AndroidManifest
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.BLUETOOTH"/>' android/app/src/main/AndroidManifest.xml || true
          fi
          flutter pub get

      - name: Biên dịch file APK Release
        run: |
          if [ -d "mobile_app" ] && [ -f "mobile_app/pubspec.yaml" ]; then
            cd mobile_app
          fi
          flutter build apk --release --no-tree-shake-icons

      - name: Tải file APK lên Artifacts để tải về
        uses: actions/upload-artifact@v4
        with:
          name: SmartERP-Android-App
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
