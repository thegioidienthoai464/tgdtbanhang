name: Tự động đóng gói App Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài đặt Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Chuẩn hóa mã nguồn và Khởi tạo Android Scaffolding
        run: |
          if [ -d "mobile_app" ] && [ -f "mobile_app/pubspec.yaml" ]; then
            cd mobile_app
          fi
          # Tự động sửa lỗi cú pháp Dart nếu có
          find lib -type f -name "*.dart" -exec sed -i 's/Border\.Border\.all/Border.all/g' {} + 2>/dev/null || true
          
          # Xóa thư mục android cũ chưa đủ cấu hình để Flutter tự sinh mới 100% chuẩn
          rm -rf android
          flutter create --org com.thegioidienthoai --project-name smart_erp_mobile --platforms=android .
          
          # Cấu hình minSdkVersion 21 cho thư viện camera quét mã vạch
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle 2>/dev/null || true
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle 2>/dev/null || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts 2>/dev/null || true
          fi
          
          # Cấp quyền Camera, Bluetooth và Internet vào AndroidManifest
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.BLUETOOTH"/>\n    <application|' android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          fi
          
          flutter pub get

      - name: Biên dịch file APK Release
        run: |
          if [ -d "mobile_app" ] && [ -f "mobile_app/pubspec.yaml" ]; then
            cd mobile_app
          fi
          flutter build apk --release --no-tree-shake-icons

      - name: Tải file APK lên Artifacts để tải về
        uses: actions/upload-artifact@v4
        with:
          name: SmartERP-Android-App
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
