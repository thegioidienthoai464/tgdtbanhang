name: Tự động đóng gói App Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài đặt Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Chuẩn hóa mã nguồn và Khởi tạo Android Scaffolding
        run: |
          if [ -d "mobile_app" ] && [ -f "mobile_app/pubspec.yaml" ]; then
            cd mobile_app
          fi
          # Tự động sửa lỗi cú pháp Dart nếu có
          find lib -type f -name "*.dart" -exec sed -i 's/Border\.Border\.all/Border.all/g' {} + 2>/dev/null || true
          
          # Xóa thư mục android cũ chưa đủ cấu hình để Flutter tự sinh mới 100% chuẩn
          rm -rf android
          flutter create --org com.thegioidienthoai --project-name tt_pos --platforms=android .
          
          # Cấu hình minSdkVersion 21 cho thư viện camera quét mã vạch
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle 2>/dev/null || true
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle 2>/dev/null || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts 2>/dev/null || true
          fi
          
          # Cập nhật tên App Android thành T&T POS và cấp quyền
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:label="[^"]*"/android:label="T\&T POS"/g' android/app/src/main/AndroidManifest.xml 2>/dev/null || true
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.BLUETOOTH"/>\n    <application|' android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          fi

          # Tự động thay icon ứng dụng bằng Logo T&T POS
          if [ -f "assets/images/logo.png" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp assets/images/logo.png "$dir/ic_launcher.png" 2>/dev/null || true
              fi
            done
          fi
          
          flutter pub get

      - name: Biên dịch file APK Release
        run: |
          if [ -d "mobile_app" ] && [ -f "mobile_app/pubspec.yaml" ]; then
            cd mobile_app
          fi
          flutter build apk --release --no-tree-shake-icons

      - name: Tải file APK lên Artifacts để tải về
        uses: actions/upload-artifact@v4
        with:
          name: TT-POS-Android-App
          path: '**/build/app/outputs/flutter-apk/app-release.apk'

      - name: Tạo GitHub Release cho bản tải trực tiếp
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.9
          name: T&T POS v1.0.9
          body: |
            Bản cập nhật v1.0.9:
            - Bổ sung chọn khách hàng trên giao diện thu ngân POS (tìm kiếm theo tên, SĐT, hiển thị nợ cũ).
            - Bổ sung phương thức thanh toán hỗn hợp (kết hợp linh hoạt Tiền mặt + Chuyển khoản ngân hàng).
            - Cho phép lựa chọn tài khoản ngân hàng nhận tiền chi tiết khi thanh toán chuyển khoản.
            - Tự do điều chỉnh số tiền khách thanh toán: tự động tính tiền thiếu (ghi nhận vào công nợ) hoặc tiền thừa (trả khách hoặc cấn trừ nợ).
          files: '**/build/app/outputs/flutter-apk/app-release.apk'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
