name: Tự động đóng gói App iOS (IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS Release IPA
    runs-on: macos-14

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Khởi tạo cấu hình iOS và Cài đặt thư viện
        run: |
          if [ -d "mobile_app" ] && [ -f "mobile_app/pubspec.yaml" ]; then
            cd mobile_app
          fi
          
          # Tự động sửa lỗi cú pháp Dart nếu có
          find lib -type f -name "*.dart" -exec sed -i '' 's/Border\.Border\.all/Border.all/g' {} + 2>/dev/null || true
          
          # Tự sinh scaffolding iOS chuẩn
          rm -rf ios
          flutter create --org com.thegioidienthoai --project-name tt_pos --platforms=ios .
          
          # Cấu hình Info.plist với tên T&T POS và quyền truy cập
          PLIST_PATH="ios/Runner/Info.plist"
          if [ -f "$PLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'T&T POS'" "$PLIST_PATH" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'T&T POS'" "$PLIST_PATH"
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Ứng dụng cần quyền Camera để quét mã vạch Barcode, QR và số IMEI sản phẩm khi bán hàng hoặc nhập kho.'" "$PLIST_PATH" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'Ứng dụng cần quyền Bluetooth để kết nối máy in nhiệt hóa đơn.'" "$PLIST_PATH" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string 'Ứng dụng cần quyền Bluetooth để kết nối máy in nhiệt hóa đơn.'" "$PLIST_PATH" 2>/dev/null || true
          fi
          
          # Cập nhật App Icon từ logo nếu có
          if [ -f "assets/images/logo.png" ]; then
            ICON_DIR="ios/Runner/Assets.xcassets/AppIcon.appiconset"
            if [ -d "$ICON_DIR" ]; then
              cp assets/images/logo.png "$ICON_DIR/Icon-App-1024x1024@1x.png" 2>/dev/null || true
            fi
          fi
          
          flutter pub get

      - name: Biên dịch iOS Release (No Code Signing)
        run: |
          if [ -d "mobile_app" ] && [ -f "mobile_app/pubspec.yaml" ]; then
            cd mobile_app
          fi
          flutter build ios --release --no-codesign

      - name: Đóng gói thành file IPA (Payload)
        run: |
          if [ -d "mobile_app" ] && [ -f "mobile_app/pubspec.yaml" ]; then
            cd mobile_app
          fi
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -y TT-POS-v1.0.2.ipa Payload
          echo "Đóng gói file IPA thành công:"
          ls -lh TT-POS-v1.0.2.ipa

      - name: Tải file IPA lên Artifacts để tải về
        uses: actions/upload-artifact@v4
        with:
          name: TT-POS-iOS-App
          path: '**/build/ios/iphoneos/TT-POS-v1.0.2.ipa'

      - name: Tải file IPA lên GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.2
          name: T&T POS v1.0.2
          files: '**/build/ios/iphoneos/TT-POS-v1.0.2.ipa'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
